<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Burger</title>

<!--style-->
    <link rel="stylesheet" href="assets/css/style.css">

<!--font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Epilogue:ital,wght@0,100..900;1,100..900&family=Pacifico&display=swap" rel="stylesheet">

</head>
<body>
<!--start header-->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <p class="header-text-1 pacifico">
                    Are you hungry?
                </p>
                <p class="header-text-2">
                    GAME NIGHT? <br>
                    WORKING LATE? <br>
                    ORDER NOW!
                </p>
                <a class="botton" href="">Go TO Menu</a>
            </div>
        </div>
    </header>
<!--end header-->

<!--start category-->
<section class="categories">
    <div class="container">
        <div class="categories-content">
            <div class="category-item">
                <div class="category-item-img">
                    <img src="assets/img/category-01.png" alt="burger">
                </div>
                <span class="category-name">Burger</span>
            </div>

            <div class="category-item">
                <div class="category-item-img">
                    <img src="assets/img/category-02.png" alt="Sub Sandwiches">
                </div>
                <span class="category-name">Sub Sandwiches</span>
            </div>

            <div class="category-item">
                <div class="category-item-img">
                    <img src="assets/img/category-03.png" alt="Beef Roll">
                </div>
                <span class="category-name">Beef Roll</span>
            </div>

            <div class="category-item">
                <div class="category-item-img">
                    <img src="assets/img/category-04.png" alt="Wedges">
                </div>
                <span class="category-name">Wedges</span>
            </div>
        </div>
    </div>
</section>
<!--end category-->
</body>
</html>
